<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SNAKE-VERSE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a10">
<style>
  :root{
    --ink:#08080d;
    --ink2:#121219;
    --ink3:#1b1b26;
    --paper:#f4f2ea;
    --white:#f7f6f2;
    --blue:#1e3fd8;
    --blue-bright:#3f7bff;
    --blue-dark:#0d1f7a;
    --red:#e8102c;
    --red-bright:#ff3b52;
    --red-dark:#7a0a18;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--ink);
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    user-select:none;
    -webkit-touch-callout:none;
    font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .app{
    position:relative;
    height:min(100dvh, 100vh, 860px);
    width:min(100vw, 440px);
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(circle at 15% 10%, rgba(232,16,44,.10), transparent 45%),
      radial-gradient(circle at 85% 95%, rgba(30,63,216,.14), transparent 50%),
      var(--ink);
  }

  /* ===== GAME PANEL (top half) ===== */

  .game-panel{
    position:relative;
    flex: 0 0 54%;
    margin:10px 10px 6px 10px;
    border-radius:6px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--ink2);
    border:4px solid #000;
    box-shadow:
      0 0 0 3px var(--white),
      0 0 0 6px #000,
      0 10px 26px rgba(0,0,0,.6);
    animation: panelGlow 3.2s ease-in-out infinite;
  }

  @keyframes panelGlow{
    0%,100%{ box-shadow:0 0 0 3px var(--white),0 0 0 6px #000, 0 0 22px 2px rgba(63,123,255,.35), 0 10px 26px rgba(0,0,0,.6); }
    50%{ box-shadow:0 0 0 3px var(--white),0 0 0 6px #000, 0 0 26px 4px rgba(255,59,82,.4), 0 10px 26px rgba(0,0,0,.6); }
  }

  .game-panel::before{
    content:'';
    position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(255,255,255,.09) 1px, transparent 1.4px);
    background-size:9px 9px;
    mix-blend-mode:overlay;
    pointer-events:none;
    z-index:2;
  }

  #gameCanvas{ display:block; image-rendering:pixelated; position:relative; z-index:1; }

  .title-bar{
    flex:0 0 auto;
    display:flex;
    justify-content:center;
    padding-top:calc(8px + env(safe-area-inset-top));
  }

  .title-badge{
    font-weight:900; letter-spacing:1.5px; color:var(--white);
    background:var(--ink);
    border:2px solid #000;
    box-shadow: 0 0 0 1.5px var(--white);
    transform:skewX(-10deg);
    text-shadow: 1.5px 1.5px 0 var(--red), -1.5px -1.5px 0 var(--blue-bright);
    font-size:12px; padding:5px 12px;
  }

  .dpad-btn.pause,

  .pause-overlay-icon{
    background:var(--ink);
    border:2px solid #000;
    box-shadow: 0 0 0 1.5px var(--white);
  }

  .dpad-btn.pause svg,

  .pause-overlay-icon svg{
    fill:var(--white);
    filter: drop-shadow(1.5px 1.5px 0 var(--red)) drop-shadow(-1.5px -1.5px 0 var(--blue-bright));
    display:block;
  }

  .icon.hidden{ display:none; }

  /* ===== DEATH OVERLAY ===== */

  .death-overlay{
    position:absolute; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background:rgba(5,5,8,0);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease, background .25s ease;
  }

  .death-overlay.show{
    opacity:1; pointer-events:auto;
    background:rgba(5,5,8,.72);
  }

  .death-burst{
    position:absolute; width:78vw; max-width:340px; aspect-ratio:1/1;
    background:conic-gradient(var(--red-bright) 0deg 30deg, var(--blue-bright) 30deg 60deg);
    transform:scale(0) rotate(0deg);
    opacity:0;
  }

  .death-overlay.show .death-burst{
    animation: burstIn .5s cubic-bezier(.2,1.4,.4,1) forwards;
  }

  @keyframes burstIn{
    0%{ transform:scale(0) rotate(0deg); opacity:0; }
    60%{ transform:scale(1.05) rotate(12deg); opacity:.9;}
    100%{ transform:scale(1) rotate(8deg); opacity:.55; }
  }

  .death-content{ position:relative; z-index:2; text-align:center; padding:0 16px; }

  .death-title{
    font-size:clamp(30px,9vw,46px);
    color:var(--white);
    letter-spacing:2px;
    transform:skewX(-8deg) scale(.6);
    opacity:0;
    text-shadow:3px 3px 0 var(--red), -3px -3px 0 var(--blue-bright), 0 0 22px rgba(0,0,0,.8);
    -webkit-text-stroke:1.5px #000;
  }

  .death-overlay.show .death-title{
    animation: titlePop .45s cubic-bezier(.2,1.6,.3,1) .1s forwards;
  }

  @keyframes titlePop{
    0%{ transform:skewX(-8deg) scale(.4); opacity:0; }
    70%{ transform:skewX(-8deg) scale(1.15); opacity:1; }
    100%{ transform:skewX(-8deg) scale(1); opacity:1; }
  }

  .death-score{
    margin-top:10px; color:var(--paper); font-size:15px; letter-spacing:1px;
    opacity:0;
  }

  .death-overlay.show .death-score{ animation: fadeUp .4s ease .3s forwards; }

  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .restart-btn{
    margin-top:16px;
    font-family:inherit; font-weight:900; letter-spacing:1.5px; font-size:15px;
    color:var(--white);
    background:linear-gradient(160deg, var(--red-bright), var(--red-dark));
    border:3px solid #000;
    box-shadow:0 5px 0 #4a0710, 0 8px 14px rgba(0,0,0,.5);
    padding:12px 26px; border-radius:10px;
    transform:skewX(-6deg) scale(.7);
    opacity:0;
  }

  .death-overlay.show .restart-btn{ animation: fadeUp .4s ease .45s forwards, skewSit .4s ease .45s forwards; }

  @keyframes skewSit{ to{ transform:skewX(-6deg) scale(1); } }

  .restart-btn:active{ transform:skewX(-6deg) translateY(4px); box-shadow:0 1px 0 #4a0710; }

  /* ===== SCORE BAR ===== */

  .score-bar{
    position:relative;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:8px 10px;
    z-index:3;
  }

  .score-badge{
    position:relative;
    font-size:14px; font-weight:900; letter-spacing:1px; color:var(--white);
    padding:8px 16px;
    background:linear-gradient(160deg, var(--blue-bright), var(--blue-dark));
    border:3px solid #000;
    box-shadow:0 0 0 1.5px var(--white), 0 4px 0 rgba(0,0,0,.5);
    transform:skewX(-8deg);
    transition: transform .12s ease;
  }

  .score-badge.best{ background:linear-gradient(160deg, var(--red-bright), var(--red-dark)); }

  .score-badge span{ display:inline-block; transform:skewX(8deg); margin-left:4px; }

  .score-badge.flash{ animation:badgeFlash .3s ease; }

  @keyframes badgeFlash{ 0%{transform:skewX(-8deg) scale(1);} 40%{transform:skewX(-8deg) scale(1.22);} 100%{transform:skewX(-8deg) scale(1);} }

  .particle-layer{
    position:absolute; inset:0; pointer-events:none; overflow:visible;
  }

  .particle{
    position:absolute; width:7px; height:7px; border-radius:50%;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    animation:particleFly .7s ease-out forwards;
  }

  @keyframes particleFly{
    to{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0); opacity:0; }
  }

  .score-pop{
    position:absolute; left:50%; top:0;
    transform:translate(-50%,0);
    font-weight:900; font-size:20px; color:var(--white);
    text-shadow:2px 2px 0 var(--red), -2px -2px 0 var(--blue-bright);
    animation:popUp .6s ease-out forwards;
    pointer-events:none;
  }

  @keyframes popUp{
    0%{ transform:translate(-50%,0) scale(.5); opacity:1; }
    55%{ transform:translate(-50%,-32px) scale(1.25); opacity:1; }
    100%{ transform:translate(-50%,-52px) scale(1); opacity:0; }
  }

  /* ===== CONTROLS PANEL (bottom half) ===== */

  .controls-panel{
    position:relative;
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--ink2);
    margin:6px 10px calc(10px + env(safe-area-inset-bottom)) 10px;
    border-radius:6px;
    border:4px solid #000;
    box-shadow:0 0 0 3px var(--white), 0 0 0 6px #000, inset 0 0 30px rgba(0,0,0,.5);
    overflow:hidden;
  }

  .controls-panel::before{
    content:'';
    position:absolute; inset:-20%;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.035) 0deg 5deg, transparent 5deg 11deg);
    pointer-events:none;
  }

  .dpad{
    position:relative; z-index:2;
    display:grid;
    grid-template-columns: repeat(3, clamp(62px,19vw,90px));
    grid-template-rows: repeat(3, clamp(62px,19vw,90px));
    grid-template-areas:
      ".    up    ."
      "left center right"
      ".    down  .";
    gap: clamp(8px,2.4vw,14px);
  }

  .dpad-btn{
    font-family:inherit;
    appearance:none; border:none; outline:none;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(22px,6vw,30px);
    color:var(--white);
    border:3px solid #000;
    border-radius:6px;
    transition: transform .07s ease, box-shadow .07s ease, filter .07s ease;
    cursor:pointer;
  }

  .dpad-btn.up, .dpad-btn.down{
    background:linear-gradient(160deg, var(--blue-bright), var(--blue));
    box-shadow:0 0 0 1.5px var(--white), 0 6px 0 var(--blue-dark), 0 9px 14px rgba(0,0,0,.5);
  }

  .dpad-btn.left, .dpad-btn.right{
    background:linear-gradient(160deg, var(--red-bright), var(--red));
    box-shadow:0 0 0 1.5px var(--white), 0 6px 0 var(--red-dark), 0 9px 14px rgba(0,0,0,.5);
  }

  .dpad-btn.up{ grid-area:up; }

  .dpad-btn.left{ grid-area:left; }

  .dpad-btn.right{ grid-area:right; }

  .dpad-btn.down{ grid-area:down; }

  .dpad-btn.pressed.up, .dpad-btn.pressed.down{
    transform:translateY(4px) scale(.93);
    box-shadow:0 0 0 1.5px var(--white), 0 2px 0 var(--blue-dark);
    filter:brightness(1.25);
  }

  .dpad-btn.pressed.left, .dpad-btn.pressed.right{
    transform:translateY(4px) scale(.93);
    box-shadow:0 0 0 1.5px var(--white), 0 2px 0 var(--red-dark);
    filter:brightness(1.25);
  }

  .dpad-btn.pause{
    grid-area:center;
    width:100%; height:100%;
    padding:0;
  }

  .dpad-btn.pause svg{ width:56%; height:56%; }

  .dpad-btn.pressed.pause{
    transform:translateY(3px) scale(.94);
    filter:brightness(1.3);
  }

  .pause-overlay{
    position:absolute; inset:0; z-index:9;
    display:flex; align-items:center; justify-content:center;
    background:rgba(8,8,13,.55);
    opacity:0; pointer-events:none;
    transition: opacity .18s ease;
  }

  .pause-overlay.show{
    opacity:1; pointer-events:auto;
  }

  .pause-overlay-icon{
    width:78px; height:78px;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    cursor:pointer;
    box-shadow: 0 0 0 1.5px var(--white), 0 8px 18px rgba(0,0,0,.6);
  }

  .pause-overlay-icon svg{ width:46%; height:46%; }

  .pause-overlay-icon:active{
    transform:translateY(3px) scale(.94);
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="title-bar">
    <div class="title-badge">SNAKE&#8209;VERSE</div>
  </div>
  <div class="game-panel" id="gamePanel">
    <canvas id="gameCanvas"></canvas>
    <div class="death-overlay" id="deathOverlay">
      <div class="death-burst" id="deathBurst"></div>
      <div class="death-content">
        <div class="death-title">GAME OVER</div>
        <div class="death-score" id="deathScoreText">SCORE 0</div>
        <button class="restart-btn" id="restartBtn">RESPAWN</button>
      </div>
    </div>
    <div class="pause-overlay" id="pauseOverlay">
      <button class="pause-overlay-icon" id="pauseOverlayIcon" aria-label="Resume">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="3" width="5" height="18" rx="1.4"/><rect x="14" y="3" width="5" height="18" rx="1.4"/></svg>
      </button>
    </div>
  </div>
  <div class="score-bar">
    <div class="score-badge" id="scoreBadge">SCORE<span id="scoreVal">0</span></div>
    <div class="score-badge best">BEST<span id="bestVal">0</span></div>
    <div class="particle-layer" id="particleLayer"></div>
  </div>
  <div class="controls-panel">
    <div class="dpad">
      <button class="dpad-btn up" data-dx="0" data-dy="-1">&#9650;</button>
      <button class="dpad-btn left" data-dx="-1" data-dy="0">&#9664;</button>
      <button class="dpad-btn pause" id="pauseBtn" aria-label="Pause">
        <svg class="icon icon-pause" id="iconPause" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="3" width="5" height="18" rx="1.4"/><rect x="14" y="3" width="5" height="18" rx="1.4"/></svg>
        <svg class="icon icon-play hidden" id="iconPlay" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 3.5 L21 12 L6 20.5 Z"/></svg>
      </button>
      <button class="dpad-btn right" data-dx="1" data-dy="0">&#9654;</button>
      <button class="dpad-btn down" data-dx="0" data-dy="1">&#9660;</button>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const panel = document.getElementById('gamePanel');
  const particleLayer = document.getElementById('particleLayer');
  const scoreVal = document.getElementById('scoreVal');
  const bestVal = document.getElementById('bestVal');
  const scoreBadge = document.getElementById('scoreBadge');
  const deathOverlay = document.getElementById('deathOverlay');
  const deathScoreText = document.getElementById('deathScoreText');
  const restartBtn = document.getElementById('restartBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const pauseOverlayIcon = document.getElementById('pauseOverlayIcon');
  const iconPause = document.getElementById('iconPause');
  const iconPlay = document.getElementById('iconPlay');
  const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2.5));
  let cellSize = 20, cols = 14, rows = 18;
  let snake, prevSnake, dir, nextDir, food, score, best, moveInterval, lastTick, dead, deathStart, paused;
  let goldenFood, goldenExpireAt, pauseStartTime;

  function loadBest(){
    try{ return parseInt(localStorage.getItem('snakeverseBest') || '0', 10) || 0; }
    catch(e){ return 0; }
  }

  function saveBest(v){
    try{ localStorage.setItem('snakeverseBest', String(v)); }catch(e){}
  }

  function resizeCanvas(){
    const rect = panel.getBoundingClientRect();
    const availW = rect.width - 8;
    const availH = rect.height - 8;
    const baseCell = 20;
    cellSize = Math.max(12, Math.floor(Math.min(availW / 14, availH / 18, baseCell)));
    cols = Math.max(8, Math.floor(availW / cellSize));
    rows = Math.max(10, Math.floor(availH / cellSize));
    canvas.style.width = (cols * cellSize) + 'px';
    canvas.style.height = (rows * cellSize) + 'px';
    canvas.width = Math.floor(cols * cellSize * dpr);
    canvas.height = Math.floor(rows * cellSize * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function randCell(){
    return { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
  }

  function spawnFood(){
    let c;
    let tries = 0;
    do{
      c = randCell();
      tries++;
    } while ((snake.some(s => s.x === c.x && s.y === c.y) || (goldenFood && c.x === goldenFood.x && c.y === goldenFood.y)) && tries < 200);
    food = c;
  }

  function spawnGoldenFood(){
    let c;
    let tries = 0;
    do{
      c = randCell();
      tries++;
    } while ((snake.some(s => s.x === c.x && s.y === c.y) || (food && c.x === food.x && c.y === food.y)) && tries < 200);
    return c;
  }

  function speedForScore(){
    return Math.max(55, 110 - score * 2.5);
  }

  function initGame(){
    resizeCanvas();
    const cx = Math.floor(cols / 2), cy = Math.floor(rows / 2);
    snake = [ {x:cx,y:cy}, {x:cx-1,y:cy}, {x:cx-2,y:cy} ];
    prevSnake = snake.map(s => ({...s}));
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    moveInterval = 110;
    lastTick = performance.now();
    dead = false;
    paused = false;
    goldenFood = null;
    goldenExpireAt = 0;
    best = loadBest();
    spawnFood();
    updateScoreUI();
    deathOverlay.classList.remove('show');
    setTimeout(()=> deathOverlay.classList.add('hidden'), 0);
    pauseOverlay.classList.remove('show');
    iconPause.classList.remove('hidden');
    iconPlay.classList.add('hidden');
  }

  function updateScoreUI(){
    scoreVal.textContent = score;
    if (score > best){
      best = score;
      saveBest(best);
    }
    bestVal.textContent = best;
  }

  function setDir(dx, dy){
    if (dead || paused) return;
    if (dx === -nextDir.x && dy === -nextDir.y) return;
    if (dx === nextDir.x && dy === nextDir.y && snake.length > 1) return;
    nextDir = {x:dx, y:dy};
  }

  function bodyCollides(pos){
    for (let i = 0; i < snake.length - 1; i++){
      if (snake[i].x === pos.x && snake[i].y === pos.y) return true;
    }
    return false;
  }

  function doTick(now){
    dir = nextDir;
    const head = snake[0];
    const newHead = { x: head.x + dir.x, y: head.y + dir.y };
    if (newHead.x < 0 || newHead.x >= cols || newHead.y < 0 || newHead.y >= rows || bodyCollides(newHead)){
      triggerDeath();
      return;
    }
    prevSnake = snake.map(s => ({...s}));
    const ateFood = newHead.x === food.x && newHead.y === food.y;
    const ateGolden = !!(goldenFood && newHead.x === goldenFood.x && newHead.y === goldenFood.y);
    snake.unshift(newHead);
    if (ateFood){
      score++;
      updateScoreUI();
      spawnScoreParticles();
      spawnFood();
      moveInterval = speedForScore();
      prevSnake.push({...prevSnake[prevSnake.length - 1]});
      scoreBadge.classList.add('flash');
      setTimeout(()=>scoreBadge.classList.remove('flash'), 300);
    } else if (ateGolden){
      score++;
      updateScoreUI();
      spawnGoldenParticles();
      moveInterval = speedForScore();
      goldenFood = null;
      const minLen = 3;
      let removeCount = Math.min(3, Math.max(0, snake.length - minLen));
      for (let k = 0; k < removeCount; k++) snake.pop();
      scoreBadge.classList.add('flash');
      setTimeout(()=>scoreBadge.classList.remove('flash'), 300);
    } else {
      snake.pop();
    }
    if (goldenFood && now >= goldenExpireAt){
      goldenFood = null;
    }
    if (!goldenFood && !ateGolden && Math.random() < 0.012){
      goldenFood = spawnGoldenFood();
      goldenExpireAt = now + 2500;
    }
    lastTick = now;
  }

  function spawnScoreParticles(){
    const colors = ['var(--blue-bright)','var(--red-bright)','var(--white)'];
    for (let i = 0; i < 14; i++){
      const p = document.createElement('span');
      p.className = 'particle';
      const angle = Math.random() * Math.PI * 2;
      const dist = 34 + Math.random() * 54;
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      p.style.background = colors[i % colors.length];
      particleLayer.appendChild(p);
      setTimeout(()=> p.remove(), 720);
    }
    const pop = document.createElement('div');
    pop.className = 'score-pop';
    pop.textContent = '+1';
    particleLayer.appendChild(pop);
    setTimeout(()=> pop.remove(), 620);
  }

  function spawnGoldenParticles(){
    const colors = ['#ffd23f','#ffe9a8','var(--white)'];
    for (let i = 0; i < 20; i++){
      const p = document.createElement('span');
      p.className = 'particle';
      const angle = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * 70;
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      p.style.background = colors[i % colors.length];
      p.style.boxShadow = '0 0 6px rgba(255,210,63,.9)';
      particleLayer.appendChild(p);
      setTimeout(()=> p.remove(), 780);
    }
    const pop = document.createElement('div');
    pop.className = 'score-pop';
    pop.style.color = '#ffd23f';
    pop.style.fontSize = '15px';
    pop.style.textShadow = '2px 2px 0 var(--red-dark), -2px -2px 0 var(--blue-dark)';
    pop.textContent = '+1  \u2212 2 LEN';
    particleLayer.appendChild(pop);
    setTimeout(()=> pop.remove(), 620);
  }

  function spawnDeathParticles(){
    const rect = canvas.getBoundingClientRect();
    const panelRect = panel.getBoundingClientRect();
    const head = snake[0];
    const cx = rect.left - panelRect.left + head.x * cellSize + cellSize/2;
    const cy = rect.top - panelRect.top + head.y * cellSize + cellSize/2;
    const colors = ['var(--blue-bright)','var(--red-bright)','var(--white)'];
    for (let i = 0; i < 36; i++){
      const p = document.createElement('span');
      p.className = 'particle';
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.width = (5 + Math.random()*6) + 'px';
      p.style.height = p.style.width;
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 120;
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (0.6 + Math.random()*0.5) + 's';
      particleLayer.parentElement === panel ? null : null;
      panel.appendChild(p);
      setTimeout(()=> p.remove(), 1200);
    }
  }

  function togglePause(){
    if (dead) return;
    paused = !paused;
    if (paused){
      pauseOverlay.classList.add('show');
      iconPause.classList.add('hidden');
      iconPlay.classList.remove('hidden');
      pauseStartTime = performance.now();
    } else {
      pauseOverlay.classList.remove('show');
      iconPause.classList.remove('hidden');
      iconPlay.classList.add('hidden');
      const pausedFor = performance.now() - pauseStartTime;
      if (goldenFood) goldenExpireAt += pausedFor;
      lastTick = performance.now();
    }
  }

  function triggerDeath(){
    dead = true;
    deathStart = performance.now();
    if (navigator.vibrate) navigator.vibrate([40,30,60]);
    spawnDeathParticles();
    setTimeout(()=>{
      deathScoreText.textContent = 'SCORE ' + score + '   |   BEST ' + best;
      deathOverlay.classList.remove('hidden');
      requestAnimationFrame(()=> deathOverlay.classList.add('show'));
    }, 420);
  }

  function drawGrid(w,h){
    ctx.save();
    ctx.lineWidth = 1;
    for (let gx = 0; gx <= cols; gx++){
      const x = Math.round(gx*cellSize) + 0.5;
      ctx.strokeStyle = (gx % 5 === 0) ? 'rgba(63,123,255,.16)' : 'rgba(255,255,255,.055)';
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
    }
    for (let gy = 0; gy <= rows; gy++){
      const y = Math.round(gy*cellSize) + 0.5;
      ctx.strokeStyle = (gy % 5 === 0) ? 'rgba(232,16,44,.14)' : 'rgba(255,255,255,.055)';
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    }
    ctx.restore();
  }

  function lerp(a,b,t){ return a + (b-a)*t; }

  function drawRoundedCell(x,y,size,r,fill,stroke){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+size, y, x+size, y+size, r);
    ctx.arcTo(x+size, y+size, x, y+size, r);
    ctx.arcTo(x, y+size, x, y, r);
    ctx.arcTo(x, y, x+size, y, r);
    ctx.closePath();
    if (fill){ ctx.fillStyle = fill; ctx.fill(); }
    if (stroke){ ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke(); }
  }

  function render(now){
    const w = cols*cellSize, h = rows*cellSize;
    ctx.clearRect(0,0,w,h);
    // background grid tint panels (subtle comic panel cells)
    ctx.fillStyle = '#0e0e16';
    ctx.fillRect(0,0,w,h);
    drawGrid(w,h);
    let shakeX = 0, shakeY = 0;
    if (dead){
      const elapsed = now - deathStart;
      const shakeDur = 380;
      if (elapsed < shakeDur){
        const power = 1 - elapsed/shakeDur;
        shakeX = (Math.random()*2-1) * 9 * power;
        shakeY = (Math.random()*2-1) * 9 * power;
      }
    }
    ctx.save();
    ctx.translate(shakeX, shakeY);
    // food: blocky pixel pellet, hard blink (no smooth fade) to match the retro feel
    const blinkOn = Math.floor(now/180) % 2 === 0;
    const fSize = cellSize*0.7;
    const fx = food.x*cellSize + (cellSize-fSize)/2;
    const fy = food.y*cellSize + (cellSize-fSize)/2;
    ctx.save();
    ctx.shadowColor = 'rgba(255,59,82,.85)';
    ctx.shadowBlur = blinkOn ? 10 : 3;
    drawRoundedCell(fx, fy, fSize, 0, blinkOn ? '#ff3b52' : '#7a0a18', '#000');
    ctx.restore();
    // small white pixel highlight, top-left corner
    ctx.fillStyle = blinkOn ? '#ffffff' : 'rgba(255,255,255,.4)';
    ctx.fillRect(fx+fSize*0.15, fy+fSize*0.15, fSize*0.22, fSize*0.22);
    // golden food: rarer bonus pellet that shrinks the snake when eaten
    if (goldenFood){
      const remaining = goldenExpireAt - now;
      const urgent = remaining < 1500;
      const gBlinkOn = urgent ? (Math.floor(now/90) % 2 === 0) : (Math.floor(now/220) % 2 === 0);
      const gScale = urgent ? (0.8 + 0.2 * (Math.max(0,remaining)/1500)) : 1;
      const gSize = cellSize*0.74*gScale;
      const gx = goldenFood.x*cellSize + (cellSize-gSize)/2;
      const gy = goldenFood.y*cellSize + (cellSize-gSize)/2;
      ctx.save();
      ctx.shadowColor = 'rgba(255,210,63,.95)';
      ctx.shadowBlur = gBlinkOn ? 14 : 5;
      drawRoundedCell(gx, gy, gSize, 0, gBlinkOn ? '#ffd23f' : '#a8760a', '#000');
      ctx.restore();
      ctx.fillStyle = gBlinkOn ? '#ffffff' : 'rgba(255,255,255,.5)';
      ctx.fillRect(gx+gSize*0.15, gy+gSize*0.15, gSize*0.22, gSize*0.22);
    }
    // snake snaps grid-to-grid (no glide) for a classic pixel-game feel
    const t = 1;
    const n = snake.length;
    // chromatic aberration ghost passes during death shake
    if (dead && now - deathStart < 380){
      const power = 1 - (now-deathStart)/380;
      drawSnakeBody(t, n, cellSize*0.9, `rgba(255,59,82,${0.35*power})`, 4*power, 0);
      drawSnakeBody(t, n, cellSize*0.9, `rgba(63,123,255,${0.35*power})`, -4*power, 0);
    }
    drawSnakeBody(t, n, cellSize*0.86, null, 0, 0, true);
    ctx.restore();
  }

  function drawSnakeBody(t, n, size, overrideColor, offX, offY, withDetail){
    for (let i = n-1; i >= 0; i--){
      const prev = prevSnake[i] || snake[i];
      const cur = snake[i];
      const x = lerp(prev.x, cur.x, t) * cellSize + (cellSize - size)/2 + offX;
      const y = lerp(prev.y, cur.y, t) * cellSize + (cellSize - size)/2 + offY;
      const isHead = i === 0;
      let fill;
      if (overrideColor){
        fill = overrideColor;
      } else if (isHead){
        fill = '#ffffff';
      } else {
        fill = (i % 2 === 0) ? '#3f7bff' : '#e8102c';
      }
      ctx.save();
      if (isHead && withDetail){
        ctx.shadowColor = 'rgba(255,255,255,.65)';
        ctx.shadowBlur = 10;
      }
      drawRoundedCell(x, y, size, isHead ? size*0.1 : 0, fill, overrideColor ? null : '#000');
      ctx.restore();
      if (isHead && withDetail){
        // comic eyes
        const ex = x + size*0.5, ey = y + size*0.5;
        ctx.fillStyle = '#000';
        const eyeOff = size*0.16;
        const dxn = dir.x, dyn = dir.y;
        const perpX = -dyn, perpY = dxn;
        [-1,1].forEach(side=>{
          const cxx = ex + dxn*eyeOff + perpX*eyeOff*side*1.4;
          const cyy = ey + dyn*eyeOff + perpY*eyeOff*side*1.4;
          ctx.beginPath();
          ctx.rect(cxx-size*0.07, cyy-size*0.07, size*0.14, size*0.14);
          ctx.fill();
        });
      }
    }
  }

  function loop(now){
    if (!dead && !paused){
      if (now - lastTick >= moveInterval){
        doTick(now);
      }
    }
    render(now);
    requestAnimationFrame(loop);
  }
  // ---- input ----
  document.querySelectorAll('.dpad-btn:not(.pause)').forEach(btn=>{
    const dx = parseInt(btn.dataset.dx,10);
    const dy = parseInt(btn.dataset.dy,10);
    const press = (e)=>{
      e.preventDefault();
      btn.classList.add('pressed');
      setDir(dx,dy);
    };
    const release = (e)=>{
      btn.classList.remove('pressed');
    };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('contextmenu', e=>e.preventDefault());
  });
  window.addEventListener('keydown', (e)=>{
    switch(e.key){
      case 'ArrowUp': case 'w': case 'W': setDir(0,-1); break;
      case 'ArrowDown': case 's': case 'S': setDir(0,1); break;
      case 'ArrowLeft': case 'a': case 'A': setDir(-1,0); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1,0); break;
      case 'Escape':
        e.preventDefault();
        togglePause();
        break;
    }
  });
  restartBtn.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    initGame();
  });
  pauseBtn.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    pauseBtn.classList.add('pressed');
    togglePause();
  });
  pauseBtn.addEventListener('pointerup', ()=> pauseBtn.classList.remove('pressed'));
  pauseBtn.addEventListener('pointerleave', ()=> pauseBtn.classList.remove('pressed'));
  pauseBtn.addEventListener('contextmenu', e=>e.preventDefault());
  pauseOverlayIcon.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    togglePause();
  });
  let resizeTimer;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{ if(!dead) initGame(); else resizeCanvas(); }, 150);
  });
  document.addEventListener('visibilitychange', ()=>{
    if (!document.hidden) lastTick = performance.now();
  });
  initGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
